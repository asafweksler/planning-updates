[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "20"


[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/updates"
  to = "/.netlify/functions/updates"
  status = 200

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync-xplan"
  status = 200

[[redirects]]
  from = "/api/debug/last-sync"
  to = "/.netlify/functions/debug-last-sync"
  status = 200
